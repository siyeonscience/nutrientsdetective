<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영양소 탐정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#f0e2c4;color:#2f2a24;
  font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
.screen{position:absolute;inset:0;display:none;}
.screen.on{display:block;}
.jua{font-family:'Jua','Malgun Gothic',sans-serif;}

/* ===== 공통 버튼 ===== */
.btn{font-family:'Jua','Malgun Gothic',sans-serif;font-size:24px;padding:13px 50px;border:none;border-radius:999px;
  background:linear-gradient(#ff9d45,#f06e28);color:#fff;cursor:pointer;letter-spacing:.04em;
  box-shadow:0 6px 0 #c4541b,0 12px 22px rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c4541b,0 6px 12px rgba(0,0,0,.18);}
.btn.sub{background:linear-gradient(#5aa9e6,#2f7fc4);box-shadow:0 6px 0 #22609a,0 12px 22px rgba(0,0,0,.18);font-size:20px;padding:10px 34px;}

/* ===== 인트로 ===== */
#intro{background:radial-gradient(ellipse at 50% 35%,#fff8e8 0%,#f2e4c6 55%,#e0cb9f 100%);}
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;transition:opacity .5s,transform .5s;text-align:center;padding:20px;}
.title-wrap.hide{opacity:0;transform:translateY(-30px);pointer-events:none;}
.logo{width:130px;height:130px;animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.title{font-family:'Jua','Malgun Gothic',sans-serif;font-size:clamp(52px,10vw,96px);color:#3d2b17;letter-spacing:.05em;
  text-shadow:0 5px 0 #f6c453,0 10px 22px rgba(0,0,0,.15);line-height:1.1;}
.subtitle{font-size:clamp(14px,2.4vw,18px);color:#6b5638;margin-bottom:22px;}

.book-stage{position:absolute;left:50%;top:calc(50% - 34px);width:980px;height:620px;
  transform:translate(-50%,-50%) scale(var(--s,1));display:none;opacity:0;transition:opacity .6s;}
.book-stage.show{display:block;}
.book-stage.in{opacity:1;}
.book{position:absolute;inset:0;perspective:2600px;transition:transform 1.2s cubic-bezier(.6,.05,.3,1);}
.book.closed{transform:translateX(-245px);}
.back-cover{position:absolute;left:490px;top:-10px;width:500px;height:640px;background:#22473d;
  border-radius:0 14px 14px 0;box-shadow:0 22px 40px rgba(0,0,0,.3);}
.page-r{position:absolute;left:490px;top:0;width:490px;height:620px;z-index:1;}
.leaf{position:absolute;left:490px;top:0;width:490px;height:620px;transform-origin:left center;
  transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.45,.05,.35,1);}
.leaf.cover{top:-10px;width:500px;height:640px;}
.leaf.flipped{transform:rotateY(-180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;}
.face.back{transform:rotateY(180deg);}

.cover .front{background:linear-gradient(135deg,#2f6253,#244c41);border-radius:0 14px 14px 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#f6d98a;}
.cover .front::before{content:'';position:absolute;inset:22px;border:3px double rgba(246,217,138,.6);border-radius:8px;}
.cover .front::after{content:'';position:absolute;left:0;top:0;bottom:0;width:26px;
  background:linear-gradient(to right,rgba(0,0,0,.3),rgba(0,0,0,0));}
.cover-title{font-family:'Jua','Malgun Gothic',sans-serif;font-size:66px;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.3);}
.cover-sub{font-size:18px;letter-spacing:.3em;opacity:.85;}
.cover .back{background:#e9dcc0 repeating-linear-gradient(45deg,rgba(80,120,100,.08) 0 10px,transparent 10px 20px);
  border-radius:14px 0 0 14px;}

.paper{background:#fffdf6;}
.page-r .paper,.leaf .front.paper{background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,0) 38px),#fffdf6;}
.leaf .back.paper{background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,0) 38px),#fffdf6;}
.pg{position:absolute;inset:0;padding:30px 30px 26px 34px;display:flex;flex-direction:column;gap:12px;}
.leaf .back .pg{padding:30px 34px 26px 30px;}
.pg h2{font-family:'Jua','Malgun Gothic',sans-serif;font-size:26px;color:#5a4325;font-weight:400;
  border-bottom:2px dashed #dccaa4;padding-bottom:6px;}
.pg .pno{margin-top:auto;text-align:center;font-size:12px;color:#a9977a;}
.pg .tip{font-size:13px;color:#7a6440;background:#fbf2dc;border-radius:10px;padding:8px 12px;line-height:1.5;}

.intro-pg{align-items:center;justify-content:center;text-align:center;gap:18px;}
.intro-pg h3{font-family:'Jua','Malgun Gothic',sans-serif;font-size:38px;color:#3d2b17;font-weight:400;}
.intro-pg p{font-size:16px;line-height:1.8;color:#5a4a35;word-break:keep-all;}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.chip{font-family:'Jua','Malgun Gothic',sans-serif;color:#fff;padding:5px 14px;border-radius:999px;font-size:17px;}

.next-btn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .5s;}
.next-btn.show{opacity:1;pointer-events:auto;}
.next-btn:active{transform:translateX(-50%) translateY(4px);}

/* ===== 검출 방법 카드 ===== */
.mcard{--c:#888;position:relative;background:#fff;border:2.5px solid var(--c);border-radius:18px;
  padding:24px 14px 12px;margin-top:16px;}
.mhead{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:var(--c);color:#fff;
  font-family:'Jua','Malgun Gothic',sans-serif;font-size:20px;padding:3px 22px;border-radius:999px;white-space:nowrap;}
.mbody{display:flex;align-items:center;gap:10px;}
.millu{width:190px;height:114px;flex-shrink:0;}
.minfo{flex:1;font-size:13px;line-height:1.5;word-break:keep-all;}
.minfo p{margin-bottom:4px;}
.minfo b{display:inline-block;background:#f2ebdc;color:#6b5638;border-radius:6px;padding:0 6px;margin-right:5px;font-size:12px;}
.mres{font-family:'Jua','Malgun Gothic',sans-serif;font-size:20px;margin-top:4px;}

/* ===== 실험실 ===== */
#lab{background:#dfe9ef;display:none;flex-direction:column;}
#lab.on{display:flex;}
.labbar{flex-shrink:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:#2f5d50;color:#f6d98a;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2;}
.labbar .lt{font-family:'Jua','Malgun Gothic',sans-serif;font-size:24px;display:flex;align-items:center;gap:8px;}
.labbar .lt small{font-size:15px;color:#cfe3da;}
.dict{display:flex;align-items:center;gap:6px;background:#f6d98a;color:#2f5d50;border:none;border-radius:12px;
  padding:6px 12px 6px 8px;cursor:pointer;font-family:'Jua','Malgun Gothic',sans-serif;font-size:16px;
  box-shadow:0 3px 0 #c9a54a;}
.dict:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a54a;}
.dict svg{width:30px;height:30px;}
.labwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
#labsvg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;}
.bottle{cursor:pointer;}
.hint{animation:pulse 1.1s ease-in-out infinite;pointer-events:none;}
.hint rect.ring{animation:march .9s linear infinite;}
@keyframes march{to{stroke-dashoffset:-34;}}
@keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
.bubble{animation:bob2 1.4s ease-in-out infinite;}
@keyframes bob2{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

#toast{position:absolute;left:50%;top:72px;transform:translate(-50%,-10px);background:rgba(47,42,36,.88);color:#fff;
  padding:10px 20px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  white-space:nowrap;z-index:5;}
#toast.show{opacity:1;transform:translate(-50%,0);}

.overlay{position:absolute;inset:0;background:rgba(30,26,20,.5);display:none;align-items:center;justify-content:center;
  z-index:10;padding:14px;}
.overlay.on{display:flex;}
.modal{background:#fffdf6;border-radius:20px;width:min(980px,100%);max-height:100%;overflow:auto;padding:18px 22px 22px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .3s ease-out;}
@keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.modal-h h2{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:26px;color:#3d2b17;}
.xbtn{border:none;background:#efe4cc;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;color:#5a4325;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;}
@media (max-width:760px){.mgrid{grid-template-columns:1fr;}}

.done-card{background:#fffdf6;border-radius:22px;padding:28px 34px;text-align:center;max-width:440px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .3s ease-out;}
.done-card h3{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:30px;color:#3d2b17;margin-bottom:10px;}
.done-card p{font-size:15px;line-height:1.7;color:#5a4a35;margin-bottom:20px;word-break:keep-all;}
.done-card .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* ===== 상단 버튼(보고서/검출 방법) ===== */
.hbtns{display:flex;gap:8px;align-items:center;}
.rep{position:relative;}
.badge{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;background:#e5484d;
  color:#fff;font:700 12px/21px 'Noto Sans KR',sans-serif;text-align:center;display:none;box-shadow:0 0 0 2px #2f5d50;}
.badge.on{display:block;}
.bump{animation:bump .65s ease-out;}
@keyframes bump{0%{transform:scale(1);}30%{transform:scale(1.28);}60%{transform:scale(.92);}100%{transform:scale(1);}}

/* ===== 결과 기록표 ===== */
.rtpop{background:#fffdf6;border-radius:18px;padding:12px 16px 12px;box-shadow:0 4px 10px rgba(0,0,0,.16);
  border:2px solid #e2d3b0;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:#2f2a24;}
.rtpop.pop{animation:pop .35s ease-out;}
.rtpop.shake{animation:shake .45s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
#rtBox{padding:4px 8px 14px;}
.rt-h{font-size:15px;color:#5a4a35;margin-bottom:6px;}
.rt-h b{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:20px;color:#3d2b17;margin-right:8px;}
.rt{border-collapse:separate;border-spacing:3px;width:100%;}
.rt th{color:#fff;font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:18px;padding:5px;border-radius:9px 9px 0 0;}
.rt th.corner{background:none;}
.rt td{text-align:center;padding:6px 4px;}
.rt td.rl{background:#fff;font-weight:700;font-size:13.5px;color:#33475a;line-height:1.35;width:230px;border:1px solid #e3e8ee;border-radius:8px;}
.mk{width:38px;height:38px;border-radius:50%;border:2px solid #a9b4c0;background:#fff;cursor:pointer;position:relative;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.14);vertical-align:middle;}
.mk:disabled{cursor:default;}
.mk .ck{position:absolute;left:3px;top:-10px;width:42px;height:42px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .15s;}
.mk.on .ck{opacity:1;transform:scale(1);}
.mk.bad{border-color:#e5484d;box-shadow:0 0 0 4px rgba(229,72,77,.3);}
.rt-f{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:6px;min-height:46px;}
.rt-f .msg{flex:1;font-size:14px;font-weight:700;line-height:1.4;word-break:keep-all;}
.rt-f .msg.ok{color:#1f9a5c;}
.rt-f .msg.no{color:#d63c41;}
.rt-f .btn{font-size:19px;padding:8px 28px;}
.rep-sec{margin-top:10px;}
.rep-sec h3{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:20px;color:#3d2b17;margin-bottom:6px;}
.rep-sec .tag{display:inline-block;margin-left:8px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:#fff;background:#2bb673;border-radius:999px;padding:1px 10px;vertical-align:middle;}
.rep-empty{padding:30px 10px;text-align:center;color:#7a6a50;line-height:1.8;}

/* ===== 중탕 김 ===== */
#steam path{opacity:0;}
#steam.on path{animation:steam 2.6s ease-in-out infinite;}
#steam.on path:nth-child(2){animation-delay:.8s;}
#steam.on path:nth-child(3){animation-delay:1.6s;}
@keyframes steam{0%{opacity:0;transform:translateY(10px);}40%{opacity:.85;}100%{opacity:0;transform:translateY(-30px);}}

/* ===== 보고서 버튼 주목 ===== */
.attn{animation:attn 1.2s ease-out infinite;}
.attn::after{content:'클릭해 보세요!';position:absolute;top:calc(100% + 10px);right:0;background:#ffb21e;color:#fff;
  font-family:'Jua','Malgun Gothic',sans-serif;font-size:15px;padding:4px 12px;border-radius:999px;white-space:nowrap;
  animation:bob2 1.4s ease-in-out infinite;pointer-events:none;}
@keyframes attn{0%{box-shadow:0 3px 0 #c9a54a,0 0 0 0 rgba(255,178,30,.9);}100%{box-shadow:0 3px 0 #c9a54a,0 0 0 14px rgba(255,178,30,0);}}

/* ===== 보고서 패널 ===== */
#repDim{position:fixed;inset:0;background:rgba(30,26,20,.5);opacity:0;pointer-events:none;transition:opacity .5s;z-index:20;}
#repDim.on{opacity:1;pointer-events:auto;}
.rep-panel{position:fixed;z-index:21;background:#fffdf6;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);
  padding:14px 20px 16px;overflow:auto;display:none;max-height:calc(100vh - 80px);border:2px solid #e2d3b0;
  transition:left .75s cubic-bezier(.5,0,.3,1),top .75s cubic-bezier(.5,0,.3,1),width .75s cubic-bezier(.5,0,.3,1);}
.rep-panel.on{display:block;}
.rep-panel.center{max-height:calc(100vh - 40px);}
.rep-panel.pop{animation:dockpop .35s ease-out;transform-origin:top right;}
@keyframes dockpop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.rep-panel .modal-h{margin-bottom:2px;}
.rep-sec.shake{animation:shake .45s;}
.rep-sec h3 small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:#5a4a35;margin-top:2px;}
.rt tr.bene td.rl{background:#efe9dd;}
.mk.tb{border:none;background:none;box-shadow:none;width:42px;height:48px;}
.mk.tb .ti{width:30px;height:44px;display:block;margin:0 auto;}
.mk.tb .ck{left:4px;top:-4px;}
.mk.tb.bad{box-shadow:0 0 0 4px rgba(229,72,77,.3);border-radius:10px;}
.rep-q{font-family:'Jua','Malgun Gothic',sans-serif;font-size:21px;color:#3d2b17;margin:16px 0 8px;}

/* 공책 */
.nb{position:relative;border:4px solid #9cc7ec;border-radius:20px;background:#fff;padding:16px 16px 16px 44px;}
.nb .rings{position:absolute;left:-14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-evenly;}
.nb .rings i{display:block;width:34px;height:9px;border-radius:5px;background:linear-gradient(#e9edf1,#8f99a3);box-shadow:0 1px 1px rgba(0,0,0,.3);}
.nb-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:640px){.nb-cards{grid-template-columns:1fr;}}
.nc{position:relative;border:1.5px solid #cfd3d8;border-radius:12px;min-height:140px;padding:44px 14px 22px 14px;background:#fff;
  transition:border-color .2s,box-shadow .2s;}
.nc::after{content:'';position:absolute;right:-1.5px;bottom:-1.5px;width:26px;height:26px;border-radius:0 0 12px 0;
  background:linear-gradient(135deg,#fff 50%,var(--t) 50%);}
.ntag{position:absolute;left:10px;top:10px;background:var(--c);color:#fff;font-family:'Jua','Malgun Gothic',sans-serif;
  font-size:16px;padding:3px 26px 3px 12px;border-radius:5px 2px 2px 5px;box-shadow:3px 3px 0 rgba(0,0,0,.18);
  clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%);}
.pen{position:absolute;left:12px;top:46px;width:26px;height:26px;}
.nc textarea,.nc .ntext{display:block;width:100%;min-height:70px;margin-left:0;padding:4px 0 0 34px;border:none;outline:none;resize:none;background:transparent;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:18px;font-weight:700;color:#2a4fd6;line-height:1.5;}
.nc textarea::placeholder{color:#b9c2cc;font-weight:400;font-size:14px;}
.nc.ok{border-color:#2bb673;box-shadow:0 0 0 3px rgba(43,182,115,.25);}
.nc.no{border-color:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.25);animation:shake .45s;}
.nc .st{position:absolute;right:12px;top:10px;font-size:20px;}

/* 축하 */
#celebrate{z-index:40;}
#celebrate .done-card{max-width:620px;width:100%;}
#celebrate h3{font-size:32px;}
#repPreview{display:block;width:100%;border-radius:10px;border:1px solid #e2d3b0;margin:0 0 16px;max-height:46vh;object-fit:contain;background:#fff;}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:41;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}

/* ===== 실험실 목록으로 ===== */
.back-hub{position:absolute;left:16px;top:14px;z-index:5;font-family:'Jua','Malgun Gothic',sans-serif;font-size:17px;color:#6b5638;
  text-decoration:none;background:rgba(255,255,255,.7);padding:6px 14px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.1);}
.back-hub:hover{background:#fff;}
.hub-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;margin-right:4px;
  background:rgba(246,217,138,.18);color:#f6d98a;text-decoration:none;font-size:20px;}
.hub-btn:hover{background:rgba(246,217,138,.32);}

/* 태블릿 화면 키보드 대응: 맨 아래 버튼 줄은 보고서 창 아래에 붙어 있음 */
.rep-panel{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.rt-f.sticky{position:sticky;bottom:-16px;z-index:2;background:#fffdf6;margin:8px -20px -16px;padding:8px 20px 12px;
  box-shadow:0 -10px 14px -12px rgba(0,0,0,.35);}
</style>
</head>
<body>

<!-- ================= 인트로 + 책 ================= -->
<section id="intro" class="screen on">
  <a class="back-hub" href="index.html#list">← 실험실 목록</a>
  <div class="title-wrap" id="titleWrap">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="50" cy="50" r="34" fill="#dff1fb" stroke="#3d2b17" stroke-width="8"/>
      <circle cx="40" cy="44" r="7" fill="#f3d36b"/><circle cx="58" cy="40" r="5" fill="#9b6fd1"/>
      <circle cx="54" cy="60" r="8" fill="#e8722b"/><circle cx="38" cy="62" r="5" fill="#3f7fd0"/>
      <path d="M33 34 Q40 26 50 25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <rect x="75" y="72" width="16" height="42" rx="7" fill="#3d2b17" transform="rotate(-45 83 93)"/>
    </svg>
    <h1 class="title">영양소 탐정</h1>
    <p class="subtitle">음식 속에 숨어 있는 영양소를 찾아라!</p>
    <button class="btn" id="startBtn">시작하기</button>
  </div>

  <div class="book-stage" id="bookStage">
    <div class="book closed" id="book">
      <div class="back-cover"></div>
      <div class="page-r"><div class="face paper"><div class="pg" id="pageRight"></div></div></div>
      <div class="leaf" id="leaf1" style="z-index:2">
        <div class="face front paper"><div class="pg intro-pg">
          <h3>🔍 탐정 수첩</h3>
          <p>영양소는 특정한 <b>검출 시약</b>을 만나면<br>고유한 색깔로 변해요.</p>

<script>
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t;
let SPEED=.75; // 애니메이션 속도 (작을수록 빠름)
function tween(d,fn,e=ease){
  return new Promise(res=>{
    const t0=performance.now();d*=SPEED;
    const f=now=>{const p=Math.max(0,Math.min(1,(now-t0)/d));fn(e(p));p<1?requestAnimationFrame(f):res();};
    requestAnimationFrame(f);
  });
}

/* ================= 검출 방법 카드 ================= */
const METHODS=[
  {key:'starch',name:'녹말 검출',color:'#2a8ccc',sample:'녹말 용액',reagent:'아이오딘-아이오딘화 칼륨 용액',
   rColor:'#d97a1c',after:'#2e3c8f',result:'청람색',tc:'#24346f'},
  {key:'glucose',name:'포도당 검출',color:'#ef7a2f',sample:'포도당 용액',reagent:'베네딕트 용액',heat:true,
   rColor:'#5fc0e2',after:'#e2622f',result:'황적색',tc:'#e8692b'},
  {key:'protein',name:'단백질 검출',color:'#8648bd',sample:'단백질 용액',
   reagent:'뷰렛 용액<br>(5% 수산화 나트륨 수용액 + 1% 황산 구리(Ⅱ) 수용액)',
   rColor:'#3ea8cc',after:'#c7a2dc',result:'보라색',tc:'#8648bd'},
  {key:'fat',name:'지방 검출',color:'#cf4fae',sample:'지방 용액 + 증류수',reagent:'수단 Ⅲ 용액',
   rColor:'#e6461f',after:'#e8461f',result:'선홍색',tc:'#d43b8e'},
];
let uid=0;
const CLEAR='rgba(214,230,242,.9)';
function tubeSVG(x,y,layers){
  const id='tc'+(uid++), w=17, h=82;
  const d=`M${x-w} ${y} L${x-w} ${y+h} A${w} ${w} 0 0 0 ${x+w} ${y+h} L${x+w} ${y} Z`;
  let s=`<clipPath id="${id}"><path d="${d}"/></clipPath>`;
  layers.forEach(l=>{s+=`<rect clip-path="url(#${id})" x="${x-w}" y="${y+l.f}" width="${2*w}" height="${l.t-l.f}" fill="${l.c}"/>`;});
  s+=`<path d="${d}" fill="rgba(255,255,255,.2)" stroke="#9aa9b8" stroke-width="2.2"/>`;
  s+=`<ellipse cx="${x}" cy="${y}" rx="${w+2}" ry="3" fill="#fff" stroke="#9aa9b8" stroke-width="2"/>`;
  s+=`<line x1="${x-10}" y1="${y+10}" x2="${x-10}" y2="${y+80}" stroke="#fff" stroke-width="3" opacity=".7" stroke-linecap="round"/>`;
  return s;
}
function miniDropper(x,tip,color){
  return `<path d="M${x-5} ${tip-34} L${x-5} ${tip-9} L${x} ${tip} L${x+5} ${tip-9} L${x+5} ${tip-34} Z" fill="${color}" stroke="#7d8d9c" stroke-width="1.5"/>`+
    `<rect x="${x-7}" y="${tip-52}" width="14" height="20" rx="6" fill="#555"/>`+
    `<circle cx="${x}" cy="${tip+5}" r="2.6" fill="${color}"/>`;
}
function illu(m){
  const fat=m.key==='fat';
  const before=fat?[{f:40,t:62,c:'rgba(236,222,150,.95)'},{f:62,t:120,c:CLEAR}]:[{f:40,t:120,c:CLEAR}];
  const after=fat?[{f:40,t:62,c:m.after},{f:62,t:120,c:CLEAR}]:[{f:40,t:120,c:m.after}];
  return miniDropper(70,56,m.rColor)+tubeSVG(70,62,before)+
    `<path d="M120 112 h36 v-12 l26 20 l-26 20 v-12 h-36 z" fill="#a6c35a"/>`+
    (m.heat?`<text x="150" y="90" text-anchor="middle" font-family="Jua, Malgun Gothic, sans-serif" font-size="17" fill="#e0543f">중탕 가열</text>`:'')+
    tubeSVG(230,62,after);
}
function methodCard(m){
  return `<div class="mcard" style="--c:${m.color}"><div class="mhead">${m.name}</div><div class="mbody">
    <svg class="millu" viewBox="0 0 300 180">${illu(m)}</svg>
    <div class="minfo"><p><b>시료</b>${m.sample}</p><p><b>시약</b>${m.reagent}</p>${m.heat?'<p><b>조건</b>중탕 가열</p>':''}
    <p class="mres"><span style="color:${m.tc}">${m.result}</span>으로 변한다.</p></div></div></div>`;
}
$('#pageLeft').innerHTML=`<h2>단서 노트 ① 녹말 · 포도당</h2>${methodCard(METHODS[0])}${methodCard(METHODS[1])}<div class="pno">- 2 -</div>`;
$('#pageRight').innerHTML=`<h2>단서 노트 ② 단백질 · 지방</h2>${methodCard(METHODS[2])}${methodCard(METHODS[3])}
  <div class="tip">💡 실험실 오른쪽 위의 <b>사전 아이콘</b>을 누르면 언제든 이 검출 방법을 다시 볼 수 있어요.</div><div class="pno">- 3 -</div>`;
$('#dictGrid').innerHTML=METHODS.map(methodCard).join('');

  {col:'#e8737a',bottle:'#f6f0dd',fluid:'#f3ead0'},

const TINT=['#fde6cc','#f8d6d6','#e0eecf','#d3e0f2'];

function renderDropper(){
  $('#dropper').setAttribute('transform',`translate(${D.x},${D.y})`);
  $('#bulb').setAttribute('transform',`translate(0,-113) scale(${D.bulb},1) translate(0,113)`);
  setAttrs($('#dfluid'),{y:-D.fluid,height:D.fluid});
}
function setDropper(o){Object.assign(D,o);renderDropper();}
function moveDropper(x,y,dur,e){const x0=D.x,y0=D.y;return tween(dur,p=>setDropper({x:lerp(x0,x,p),y:lerp(y0,y,p)}),e);}
function setCap(pre,i,dx,dy){$('#'+pre+'cap'+i).setAttribute('transform',`translate(${dx},${dy})`);}
function setLevel(pre,i,lv){state.lv[pre+i]=lv;setAttrs($('#'+pre+'bl'+i),{y:-lv,height:lv});$('#'+pre+'bs'+i).setAttribute('y',-lv);}

async function capOff(pre,i){
  await tween(260,p=>setCap(pre,i,0,-40*p));
  await tween(480,p=>setCap(pre,i,62*p,lerp(-40,148,p)-Math.sin(Math.PI*p)*36));
}
async function capOn(pre,i){
  await tween(480,p=>setCap(pre,i,62*(1-p),lerp(148,-40,p)-Math.sin(Math.PI*p)*36));
  await tween(260,p=>setCap(pre,i,0,-40*(1-p)));
}

/* 용기 뚜껑 열기 → 빨아들이기 → deliver() → 정리 */
async function sampleRun(pre,i,deliver){
  SPEED=FAST;
  const x=COLX[i];
  $('#dfluid').setAttribute('fill',SAMPLES[i].fluid);
  await capOff(pre,i);
  setDropper({x,y:60,bulb:1,fluid:0});
  await tween(450,p=>{$('#dropper').setAttribute('opacity',p);setDropper({y:lerp(60,150,p)});});
  await tween(220,p=>setDropper({bulb:1-.3*p}));
  await moveDropper(x,268,520);
  const lv=state.lv[pre+i]??LV0;
  await tween(650,p=>{setDropper({bulb:.7+.3*p,fluid:56*p});setLevel(pre,i,lv-9*p);});
  await moveDropper(x,150,480);
  await deliver();
  await moveDropper(x,150,600);
  await tween(350,p=>{$('#dropper').setAttribute('opacity',1-p);setDropper({y:lerp(150,80,p)});});
  await capOn(pre,i);
  await tween(300,p=>$('#'+pre+'ck'+i).setAttribute('opacity',p));
  SPEED=NORMAL;
}

/* 실험 1: 홈 하나에 시료 넣기 */
async function dispense(i,r){
  const x=COLX[i], y=ROWY[r];
  await moveDropper(x,y-64,r===0?650:420);
  await moveDropper(x,y-22,260);
  const drop=$('#drop');
  setAttrs(drop,{fill:SAMPLES[i].fluid,cx:x,cy:D.y+4,opacity:1});
  const f0=D.fluid;
  await tween(240,p=>setDropper({bulb:1-.3*p,fluid:f0-18*p}));
  await tween(200,p=>drop.setAttribute('cy',lerp(y-18,y+2,p)),easeIn);
  drop.setAttribute('opacity',0);
  const wl=$(`#wl${r}${i}`),ws=$(`#ws${r}${i}`),wr=$(`#wr${r}${i}`);
  await Promise.all([
    tween(420,p=>{setAttrs(wl,{rx:39*p,ry:21*p});setAttrs(ws,{rx:12*p,ry:5*p});},easeOut),
    tween(420,p=>setDropper({bulb:.7+.3*p})),
    tween(560,p=>setAttrs(wr,{rx:10+32*p,ry:5+17*p,opacity:.9*(1-p)}),easeOut),
  ]);
  await moveDropper(x,y-64,220);
}

async function onBottle(i){
  if(busy)return;
  if(state.phase===2){toast('시료는 모두 넣었어요. 오른쪽 시약병을 클릭해 보세요!');return;}
  if(state.phase!==1)return;
  const S=state.s;
  if(S.done[i]){toast(`${NAMES[i]}는 이미 홈판에 넣었어요.`);return;}
  if(i!==S.next){toast(`먼저 반짝이는 ${NAMES[S.next]} 용기를 클릭해 보세요!`);shake('',i);return;}
  busy=true;hideHint();
  await sampleRun('',i,async()=>{for(let r=0;r<3;r++)await dispense(i,r);});
  S.done[i]=1;S.next=i+1;setProgress(NAMES,S.done,S.next);
  busy=false;
  if(S.next<4){showHint(S.next);toast(`잘했어요! 이번에는 ${NAMES[S.next]}를 넣어 볼까요?`);}
  else{await wait(500);openDone(1);}
}

async function shake(pre,i){
  const b=$('#'+pre+'b'+i),x=COLX[i];
  await tween(380,p=>b.setAttribute('transform',`translate(${x+Math.sin(p*Math.PI*6)*5*(1-p)},${BASE})`),t=>t);
  b.setAttribute('transform',`translate(${x},${BASE})`);
}

}
function setR(o){Object.assign(RD,o);renderR();}
// 스포이드 끝이 (wx,wy)에 오도록 이동
function moveRTip(wx,wy,dur){const x0=RD.x,y0=RD.y,x1=wx-SX,y1=wy-SY-RTIP;return tween(dur,p=>setR({x:lerp(x0,x1,p),y:lerp(y0,y1,p)}));}
function moveR(x1,y1,dur){const x0=RD.x,y0=RD.y;return tween(dur,p=>setR({x:lerp(x0,x1,p),y:lerp(y0,y1,p)}));}
const twist=dir=>tween(520,p=>setR({rot:Math.sin(p*Math.PI*6)*7,y:-115-6*(dir>0?p:1-p)}),t=>t);
async function openStation(){await twist(1);await moveR(0,-215,520);}
async function closeStation(){await moveR(0,-215,850);await moveR(0,-121,420);await twist(-1);setR({y:-115,rot:0});}

async function showReagent(R){
  const st=$('#rstation');
  $('#rliq').setAttribute('fill',rgba(R.color));
  $('#rdf').setAttribute('fill',rgba(R.color));
  $('#rcap').setAttribute('fill',R.cap);

  t.innerHTML=R.label.map((l,k)=>`<tspan x="0" y="${top+5+lh*(k+.5)+fs*.36}">${l}</tspan>`).join('');
  Object.assign(RD,{x:0,y:-115,bulb:1,fluid:RTIP-10,rot:0});renderR();
  st.style.display='';
  await tween(500,p=>{st.setAttribute('opacity',p);st.setAttribute('transform',`translate(${SX},${SY-40*(1-p)})`);},easeOut);

}
async function hideReagent(){
  const st=$('#rstation');

}
function highlightRowLabel(r,on){

$('#rstation').addEventListener('click',()=>{

});

/* ---- 실험 1 · 2단계: 검출 시약 넣기 ---- */
async function startReagents(){
  busy=true;
  state.phase=2;
  setPanel('단계 ② 검출 시약 넣기',['반짝이는 시약병을 클릭하면','스포이드로 홈판의 가로줄에','시약을 2방울씩 떨어뜨려요.']);
  $('#rowHead').textContent='검출 시약';
  setProgress(REAGENTS.map(r=>r.short),state.r.done,0);
  await tween(800,p=>$('#labsvg').setAttribute('viewBox',`0 0 ${lerp(1000,VBW2,p)} 650`));
  await showReagent(REAGENTS[0]);highlightRowLabel(0,true);
  busy=false;
}

async function reagentDrop(r,c){
  const R=REAGENTS[r], x=COLX[c], y=ROWY[r];
  const tipX=SX+RD.x, tipY=SY+RD.y+RTIP;
  const drop=$('#drop');
  setAttrs(drop,{fill:rgba(R.color),cx:tipX,cy:tipY+4,opacity:1});
  const f0=RD.fluid;
  await tween(160,p=>setR({bulb:1-.28*p,fluid:f0-3*p}));
  const ox=(Math.random()*2-1)*16, oy=(Math.random()*2-1)*7;
  await tween(190,p=>setAttrs(drop,{cx:lerp(tipX,x+ox,p),cy:lerp(tipY+4,y+3+oy,p)}),easeIn);
  drop.setAttribute('opacity',0);
  const b=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
  setAttrs(b,{cx:x+ox,cy:y+3+oy,rx:0,ry:0,fill:rgba(R.color)});
  $(`#wb${r}${c}`).appendChild(b);
  const wr=$(`#wr${r}${c}`);
  await Promise.all([
    tween(260,p=>setAttrs(b,{rx:6.5*p,ry:3.8*p}),easeOut),
    tween(220,p=>setR({bulb:.72+.28*p})),
    tween(420,p=>setAttrs(wr,{rx:8+22*p,ry:4+11*p,opacity:.8*(1-p)}),easeOut),
  ]);
}
// 2방울을 다 넣은 뒤 홈 속 색 변화
function react(r,c){
  const res=RESULT[r][c], wl=$(`#wl${r}${c}`), blobs=[...$(`#wb${r}${c}`).children];
  if(res){
    const from=WELL_RGBA[c];
    return tween(1600,p=>{
      wl.setAttribute('fill',rgba(mix(from,res,p)));
      blobs.forEach(b=>setAttrs(b,{rx:6.5+10*p,ry:3.8+5*p,opacity:1-p}));
    });
  }
  return tween(900,p=>blobs.forEach(b=>setAttrs(b,{rx:6.5+2*p,ry:3.8+1*p})));
}

async function runReagent(r){
  busy=true;hideHint();
  const rowHi=$('#rowHi');rowHi.setAttribute('y',ROWY[r]-32);rowHi.style.display='';
  await openStation();
  for(let c=0;c<4;c++){
    await moveRTip(COLX[c],ROWY[r]-46,c===0?850:420);
    await moveRTip(COLX[c],ROWY[r]-20,220);
    for(let k=0;k<2;k++){await reagentDrop(r,c);await wait(90);}
    react(r,c);
    await moveRTip(COLX[c],ROWY[r]-46,200);
  }
  await closeStation();
  rowHi.style.display='none';highlightRowLabel(r,false);
  const Rs=state.r;Rs.done[r]=1;Rs.next=r+1;setProgress(REAGENTS.map(x=>x.short),Rs.done,Rs.next);
  await wait(900);
  await hideReagent();
  if(Rs.next<3){
    toast(`잘했어요! 이번에는 ${REAGENTS[Rs.next].name}을 넣어 볼까요?`);
    await showReagent(REAGENTS[Rs.next]);highlightRowLabel(Rs.next,true);
    busy=false;
  }else startRecord();
}

/* ---- 실험 1 · 3단계: 결과 기록표 ---- */
// marks: 실험 1(3줄), bmarks: 베네딕트 줄(없으면 생략)

async function startRecord(){
  state.phase=3;
  setPanel('단계 ③ 결과 기록하기',['홈판의 색깔 변화를 관찰하고','시약의 색깔이 변한 칸을 표에','표시한 뒤 채점해 보세요.']);
  toast('홈판의 색깔 변화를 잘 관찰해 보세요!');

  const box=$('#rtBox');
  box.innerHTML=`<div class="rtpop pop">
    <div class="rt-h"><b>결과 기록</b>시약의 색깔 변화가 나타난 칸을 클릭해 표시해 보세요.</div>

function grade(){
  const m=state.marks, msg=$('#rtMsg'), box=$('#rtBox');
  const any=m.some(row=>row.some(v=>v));
  const ok=ANSWER.every((row,r)=>row.every((v,c)=>v===m[r][c]));
  if(ok){
    state.graded=true;
    box.querySelectorAll('.mk').forEach(b=>b.disabled=true);
    msg.className='msg ok';msg.textContent='정답이에요! 시약의 색깔이 변한 칸을 정확히 찾았어요. 🎉';
    $('#gradeBtn').style.display='none';$('#rtNext').style.display='';
    return;
  }
  msg.className='msg no';
  msg.textContent=any?'다시 관찰해 보세요! 시약의 색깔이 변한 칸에만 정확히 표시해야 해요.':'시약의 색깔이 변한 칸을 클릭해 표시해 보세요.';
  ANSWER.forEach((row,r)=>row.forEach((v,c)=>{if(m[r][c]&&!v)box.querySelector(`.mk[data-r="${r}"][data-c="${c}"]`).classList.add('bad');}));
  const pop=box.querySelector('.rtpop');pop.classList.remove('pop','shake');void pop.offsetWidth;pop.classList.add('shake');
}

/* 표가 '보고서' 버튼 속으로 날아 들어가는 애니메이션 */
async function toReport(){
  busy=true;
  const src=$('#rtBox .rtpop'), r1=src.getBoundingClientRect(), btn=$('#reportBtn').getBoundingClientRect();
  const w=src.offsetWidth, h=src.offsetHeight, s0=r1.width/w, s1=.04;
  const clone=src.cloneNode(true);
  clone.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  clone.classList.remove('pop','shake');
  Object.assign(clone.style,{position:'fixed',left:0,top:0,width:w+'px',margin:0,zIndex:60,transformOrigin:'0 0',pointerEvents:'none'});
  document.body.appendChild(clone);
  show($('#rtFO'),false);
  const tx=btn.left+btn.width/2-w*s1/2, ty=btn.top+btn.height/2-h*s1/2;
  const mx=lerp(r1.left,tx,.5), my=Math.min(r1.top,ty)-40;
  await clone.animate([
    {transform:`translate(${r1.left}px,${r1.top}px) scale(${s0})`,opacity:1},
    {transform:`translate(${mx}px,${my}px) scale(${(s0+s1)/2.6})`,opacity:.95,offset:.45},
    {transform:`translate(${tx}px,${ty}px) scale(${s1})`,opacity:.3},
  ],{duration:1100,easing:'cubic-bezier(.5,0,.6,1)',fill:'forwards'}).finished;
  clone.remove();
  const rb=$('#reportBtn');rb.classList.remove('bump');void rb.offsetWidth;rb.classList.add('bump');
  $('#reportBadge').classList.add('on');
  toast('결과표가 보고서에 저장되었어요! 📋');
  await wait(1200);
  goExp2();
}

/* ---- 보고서: 오른쪽 위 작은 창(dock) ↔ 가운데 큰 창(center) ---- */
let repMode=null;
function placeReport(mode,instant){
  const el=$('#report'), dock=mode==='dock', W=dock?Math.min(660,innerWidth-24):Math.min(1000,innerWidth-24);
  if(instant)el.style.transition='none';
  // 화면 키보드가 올라오면 보이는 영역(visualViewport)이 줄어들므로 그 안에 맞춤
  const v=window.visualViewport, vw=v?v.width:innerWidth, vh=v?v.height:innerHeight, vt=v?v.offsetTop:0, vl=v?v.offsetLeft:0;
  const top=vt+(dock?Math.min(66,vh*.12):Math.min(20,vh*.03));
  Object.assign(el.style,{width:W+'px',left:(vl+(dock?vw-W-12:(vw-W)/2))+'px',top:top+'px',maxHeight:Math.max(160,vt+vh-top-10)+'px'});
  el.classList.toggle('center',!dock);
  $('#repDim').classList.toggle('on',!dock);
  if(instant){void el.offsetWidth;el.style.transition='';}
  repMode=mode;
}
addEventListener('resize',()=>{if(repMode)placeReport(repMode,true);});
if(window.visualViewport)['resize','scroll'].forEach(ev=>visualViewport.addEventListener(ev,()=>{if(repMode)placeReport(repMode,true);}));
// 보고서를 다시 그린 뒤: 맨 아래 버튼 줄을 고정하고, 입력칸을 누르면 그 칸이 보이게 함

$('#reportBtn').onclick=()=>{$('#reportBtn').classList.remove('attn');openReport();};

function renderReportBody(){
  const body=$('#reportBody');
  if(!state||!state.graded){body.innerHTML='<div class="rep-empty">아직 기록된 결과가 없어요.<br>실험을 진행하면 결과가 여기에 모여요.</div>';return;}
  const ph=state.phase, recB=ph===8, editB=recB&&!state.bgraded;
  let h=`<div class="rep-sec" id="secB"><h3>실험 결과${recB?'<small>베네딕트 용액의 색깔 변화가 나타난 시험관을 클릭해 표시해 보세요.</small>':''}</h3>
    ${resultTableHTML({marks:state.marks,bmarks:ph>=8?state.bmarks:null,editB})}`;
  if(recB)h+=`<div class="rt-f"><span class="msg${state.bgraded?' ok':''}" id="bMsg">${state.bgraded?'정답이에요! 베네딕트 용액의 색깔이 변한 시험관을 정확히 찾았어요. 🎉':''}</span>
    <button class="btn sub" id="bGrade"${state.bgraded?' style="display:none"':''}>채점하기</button>
    <button class="btn" id="bNext"${state.bgraded?'':' style="display:none"'}>다음 ▶</button></div>`;
  h+='</div>';
  if(ph>=9){
    const edit=ph===9&&!state.nutOk;
    h+=`<div class="rep-q">실험 결과를 바탕으로 음식에 들어 있는 영양소를 모두 써 보자.</div>${notebookHTML(edit)}
      <div class="rt-f"><span class="msg${state.nutOk?' ok':''}" id="nMsg">${state.nutOk?'정답이에요! 음식에 들어 있는 영양소를 모두 찾았어요. 🎉':''}</span>
      ${ph===9?`<button class="btn sub" id="nCheck"${state.nutOk?' style="display:none"':''}>확인</button>
        <button class="btn" id="nDone"${state.nutOk?'':' style="display:none"'}>완료</button>`:
        '<button class="btn sub" id="nSave">이미지로 저장</button>'}</div>`;
  }
  body.innerHTML=h;
  afterReportRender(body);
  // 베네딕트 줄 표시·채점
  body.querySelectorAll('.mk[data-b]').forEach(b=>b.addEventListener('click',()=>{

    body.querySelectorAll('.mk.bad').forEach(x=>x.classList.remove('bad'));$('#bMsg').textContent='';

  if($('#bGrade'))$('#bGrade').onclick=gradeBene;

  }));

  if($('#nDone'))$('#nDone').onclick=finish;
  if($('#nSave'))$('#nSave').onclick=()=>saveReportImage();

function gradeBene(){
  const m=state.bmarks, msg=$('#bMsg');
  if(B_ANSWER.every((v,c)=>v===m[c])){state.bgraded=true;renderReportBody();return;}
  msg.className='msg no';
  msg.textContent=m.some(v=>v)?'다시 관찰해 보세요! 베네딕트 용액의 색깔이 변한 시험관에만 정확히 표시해야 해요.':'베네딕트 용액의 색깔이 변한 시험관을 클릭해 표시해 보세요.';
  B_ANSWER.forEach((v,c)=>{if(m[c]&&!v)$(`.mk[data-b="${c}"]`).classList.add('bad');});
  const sec=$('#secB');sec.classList.remove('shake');void sec.offsetWidth;sec.classList.add('shake');
}

function checkNut(v,ans){
  const t=v.replace(/\s/g,'');
  return !!t&&Object.entries(NUT_WORDS).every(([k,ws])=>ws.some(w=>t.includes(w))===ans.includes(k));
}
function checkNutrients(){
  const vals=[0,1,2].map(k=>$('#nt'+k).value.trim());state.nut=vals;
  const res=vals.map((v,k)=>checkNut(v,NUT_ANS[k]));
  state.nutSt=res.map(r=>r?'ok':'no');
  if(res.every(r=>r)){state.nutOk=true;renderReportBody();return;}
  res.forEach((r,k)=>{const el=$('#nc'+k);el.classList.remove('ok','no');void el.offsetWidth;el.classList.add(r?'ok':'no');});
  const msg=$('#nMsg');msg.className='msg no';
  msg.textContent=vals.some(v=>v)?'다시 생각해 보세요! 실험 결과표를 보고 각 음식에 들어 있는 영양소를 모두 써야 해요.':'빈칸을 클릭해 영양소를 입력해 보세요.';
}

async function saveReportImage(){

function downloadBlob(b){
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u;a.download=`nutrient-detective-report_${new Date().toISOString().slice(0,10)}.png`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}
$('#saveAgain').onclick=()=>{if(lastImg)downloadBlob(lastImg);else saveReportImage();};
$('#restartBtn').onclick=()=>{$('#celebrate').classList.remove('on');startLab();};
function confetti(){
  const cols=['#f5a043','#e8737a','#93bf55','#6c98d6','#ffb21e','#9b6fd1'];
  for(let k=0;k<70;k++){
    const d=document.createElement('div');d.className='confetti';
    Object.assign(d.style,{left:Math.random()*100+'vw',background:cols[k%cols.length],animationDuration:(2.2+Math.random()*2.2)+'s',
      animationDelay:Math.random()*.8+'s',transform:`rotate(${Math.random()*360}deg)`,borderRadius:k%3?'2px':'50%'});
    document.body.appendChild(d);setTimeout(()=>d.remove(),5500);
  }
}

/* 보고서 그림 그리기 (외부 라이브러리 없이 canvas로) */
async function makeReportImage(){
  try{await document.fonts.ready;}catch(e){}
  const W=1000, H=820, S=2, P=40;
  const JUA="'Jua','Malgun Gothic',sans-serif", NOTO="'Noto Sans KR','Malgun Gothic',sans-serif";
  const cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;
  const x=cv.getContext('2d');x.scale(S,S);
  const rr=(X,Y,w,h,r)=>{r=typeof r==='number'?[r,r,r,r]:r;x.beginPath();x.moveTo(X+r[0],Y);x.lineTo(X+w-r[1],Y);x.quadraticCurveTo(X+w,Y,X+w,Y+r[1]);
    x.lineTo(X+w,Y+h-r[2]);x.quadraticCurveTo(X+w,Y+h,X+w-r[2],Y+h);x.lineTo(X+r[3],Y+h);x.quadraticCurveTo(X,Y+h,X,Y+h-r[3]);x.lineTo(X,Y+r[0]);x.quadraticCurveTo(X,Y,X+r[0],Y);x.closePath();};
  const txt=(t,X,Y,font,color,align='left')=>{x.font=font;x.fillStyle=color;x.textAlign=align;x.textBaseline='middle';x.fillText(t,X,Y);};
  const check=(cx,cy)=>{x.save();x.translate(cx-18,cy-26);x.beginPath();x.moveTo(7,21);x.lineTo(17,32);x.lineTo(36,5);
    x.strokeStyle='#3566d6';x.lineWidth=5.5;x.lineCap='round';x.lineJoin='round';x.stroke();x.restore();};
  // 배경, 머리
  x.fillStyle='#fffdf6';x.fillRect(0,0,W,H);
  rr(0,0,W,96,[0,0,0,0]);x.fillStyle='#2f5d50';x.fill();
  txt('영양소 탐정 실험 보고서',P,50,`36px ${JUA}`,'#f6d98a');
  txt(new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}),W-P,52,`16px ${NOTO}`,'#cfe3da','right');
  // 결과표
  txt('실험 결과',P,132,`24px ${JUA}`,'#3d2b17');
  const LW=250, G=3, CW=(W-2*P-LW-4*G)/4, rows=[...ROW_LABELS,['베네딕트 용액']], RH=[62,62,52,58];
  let y=152;
  NAMES.forEach((n,c)=>{const X=P+LW+G+c*(CW+G);rr(X,y,CW,40,[9,9,0,0]);x.fillStyle=SAMPLES[c].col;x.fill();txt(n,X+CW/2,y+21,`20px ${JUA}`,'#fff','center');});
  y+=40+G;
  rows.forEach((lines,r)=>{
    const h=RH[r];
    rr(P,y,LW,h,8);x.fillStyle=r===3?'#efe9dd':'#fff';x.fill();x.strokeStyle='#e3e8ee';x.lineWidth=1;x.stroke();
    lines.forEach((l,k)=>txt(l,P+LW/2,y+h/2+(k-(lines.length-1)/2)*20,`bold 15px ${NOTO}`,'#33475a','center'));
    NAMES.forEach((_,c)=>{
      const X=P+LW+G+c*(CW+G), cx=X+CW/2, cy=y+h/2, on=r<3?state.marks[r][c]:state.bmarks[c];
      x.fillStyle=TINT[c];x.fillRect(X,y,CW,h);
      if(r<3){x.beginPath();x.arc(cx,cy,18,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.strokeStyle='#a9b4c0';x.lineWidth=2;x.stroke();}
      else{
        x.save();x.translate(cx-15,cy-22);
        x.fillStyle='#dfe6ee';x.beginPath();x.moveTo(10.5,22);x.lineTo(10.5,33);x.arc(15,33,4.5,Math.PI,0,true);x.lineTo(19.5,22);x.closePath();x.fill();
        x.strokeStyle='#9aa6b2';x.lineWidth=2.4;x.lineCap='round';x.beginPath();x.moveTo(7,3);x.lineTo(23,3);x.moveTo(10,3);x.lineTo(10,33);x.arc(15,33,5,Math.PI,0,true);x.lineTo(20,3);x.stroke();
        x.restore();
      }
      if(on)check(cx+(r<3?2:2),cy+(r<3?0:6));
    });
    y+=h+G;
  });
  // 영양소 쓰기
  y+=34;
  txt('실험 결과를 바탕으로 음식에 들어 있는 영양소를 모두 써 보자.',P,y,`22px ${JUA}`,'#3d2b17');
  y+=26;
  const NBH=210;
  rr(P,y,W-2*P,NBH,20);x.fillStyle='#fff';x.fill();x.strokeStyle='#9cc7ec';x.lineWidth=5;x.stroke();
  for(let k=0;k<5;k++){const ry=y+NBH*(k+.5)/5-5;const g=x.createLinearGradient(0,ry,0,ry+10);g.addColorStop(0,'#e9edf1');g.addColorStop(1,'#8f99a3');
    rr(P-14,ry,34,10,5);x.fillStyle=g;x.fill();}
  const cx0=P+44, cw=(W-2*P-60-32)/3, ch=NBH-32;
  NUT_COLS.forEach((c,k)=>{
    const X=cx0+k*(cw+16), Y=y+16;
    rr(X,Y,cw,ch,12);x.fillStyle='#fff';x.fill();x.strokeStyle='#cfd3d8';x.lineWidth=1.5;x.stroke();
    x.beginPath();x.moveTo(X+cw,Y+ch-26);x.lineTo(X+cw,Y+ch-12);x.quadraticCurveTo(X+cw,Y+ch,X+cw-12,Y+ch);x.lineTo(X+cw-26,Y+ch);x.closePath();x.fillStyle=SAMPLES[c].col;x.fill();
    x.font=`17px ${JUA}`;const tw=x.measureText(NAMES[c]).width+40;
    x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.moveTo(X+13,Y+13);x.lineTo(X+13+tw,Y+13);x.lineTo(X+13+tw*.92,Y+28);x.lineTo(X+13+tw,Y+43);x.lineTo(X+13,Y+43);x.fill();
    x.fillStyle=SAMPLES[c].col;x.beginPath();x.moveTo(X+10,Y+10);x.lineTo(X+10+tw,Y+10);x.lineTo(X+10+tw*.92,Y+25);x.lineTo(X+10+tw,Y+40);x.lineTo(X+10,Y+40);x.fill();
    txt(NAMES[c],X+22,Y+26,`17px ${JUA}`,'#fff');
    x.beginPath();x.arc(X+25,Y+62,12,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.strokeStyle='#9aa6b2';x.lineWidth=1.5;x.stroke();
    x.beginPath();x.moveTo(X+20,Y+67);x.lineTo(X+21.2,Y+63);x.lineTo(X+27.8,Y+56.4);x.lineTo(X+30.6,Y+59.2);x.lineTo(X+24,Y+65.8);x.closePath();x.strokeStyle='#7d8894';x.stroke();
    // 답(줄바꿈)
    x.font=`bold 20px ${NOTO}`;const maxW=cw-60;let line='',ly=Y+64;
    for(const chr of state.nut[k]){if(chr==='\n'||x.measureText(line+chr).width>maxW){txt(line,X+46,ly,`bold 20px ${NOTO}`,'#2a4fd6');line=chr==='\n'?'':chr;ly+=30;}else line+=chr;}
    txt(line,X+46,ly,`bold 20px ${NOTO}`,'#2a4fd6');
  });
  y+=NBH+50;
  txt('🎉 축하합니다! 영양소를 완벽하게 검출해 냈습니다!',W/2,y,`26px ${JUA}`,'#e8722b','center');
  return cv;
}

/* ================= 실험 2: 포도당 검출 ================= */
function buildExp2(){
  const b2=$('#bottles2');b2.innerHTML=COLX.map((x,i)=>bottleSVG('e',i)).join('');b2.setAttribute('opacity',1);show(b2,true);
  b2.querySelectorAll('.bottle').forEach(b=>b.addEventListener('click',()=>onBottle2(+b.dataset.i)));
  $('#tubes').innerHTML=TX.map((x,i)=>{
    const ch=[...NAMES[i].replace(/ /g,'')], cy=TT+38;
    return `<g id="tb${i}" transform="translate(${x},0)">
      <clipPath id="tbc${i}"><path d="${TUBE_D}"/></clipPath>
      <rect id="tbl${i}" clip-path="url(#tbc${i})" x="-18" y="${TB}" width="36" height="0" fill="${rgba(WELL_RGBA[i])}"/>
      <rect id="tbb${i}" clip-path="url(#tbc${i})" x="-18" y="${TB}" width="36" height="0" fill="${rgba(BENEDICT.color)}"/>
      <rect id="tbs${i}" x="-1.5" y="${TT-18}" width="3" height="0" opacity="0"/>
      <circle id="tbd${i}" r="5" cx="0" cy="0" opacity="0"/>
      <path d="${TUBE_D}" fill="rgba(255,255,255,.22)" stroke="#8ea3b5" stroke-width="2.2"/>
      <ellipse cx="0" cy="${TT}" rx="19" ry="3.5" fill="none" stroke="#8ea3b5" stroke-width="2"/>
      <line x1="-10" y1="${TT+74}" x2="-10" y2="${TB-24}" stroke="#fff" stroke-width="3" opacity=".7" stroke-linecap="round"/>
      <rect x="-13" y="${TT+8}" width="26" height="60" rx="4" fill="#fff" stroke="${SAMPLES[i].col}" stroke-width="2"/>
      <text text-anchor="middle" font-family="Jua, Malgun Gothic, sans-serif" font-size="13" fill="#3d2b17">${
        ch.map((c,k)=>`<tspan x="0" y="${cy-(ch.length-1)*7+k*14+5}">${c}</tspan>`).join('')}</text>
    </g>`;
  }).join('');
  ['rackBack','rackFront'].forEach(id=>{const g=$('#'+id);g.setAttribute('opacity',1);show(g,true);});
  ['bkBack','bkFront'].forEach(id=>{const g=$('#'+id);g.setAttribute('opacity',0);g.removeAttribute('transform');show(g,false);});
  $('#steam').classList.remove('on');
}
$('#rackHit').addEventListener('click',()=>{if(!busy&&state.phase===6)runHeat();});

function setTube(i,h){setAttrs($('#tbl'+i),{y:TB-h,height:h});}
const E2_STEPS=['시료 넣기','베네딕트','중탕 가열','결과 기록'];

async function goExp2(){
  busy=true;
  const e1=$('#exp1'), e2=$('#exp2');
  await fade(e1,1,0,600);show(e1,false);
  state.phase=4;
  setPanel('단계 ① 시료 넣기',['반짝이는 용기를 클릭하면','스포이드로 시료를 각 시험관에','3 mL씩 넣어요.']);
  setProgress(NAMES,state.e.done,0);
  show(e2,true);await fade(e2,0,1,600);
  toast('실험 ②: 이번에는 시험관으로 포도당을 검출해 봐요!');
  showHint(0);busy=false;
}

async function fillTube(i){
  const x=TX[i];
  await moveDropper(x,TT-18,700);
  const st=$('#tbs'+i);   // 라벨 뒤로 흘러 들어가도록 시험관 안쪽 층 사용
  setAttrs(st,{height:0,fill:SAMPLES[i].fluid,opacity:1});
  const f0=D.fluid;
  await tween(1000,p=>{
    const h=TLV*p;setTube(i,h);
    setDropper({bulb:1-.3*Math.min(1,p*3),fluid:f0*(1-p)});
    st.setAttribute('height',Math.max(0,TB-h-(TT-18)));
  });
  st.setAttribute('opacity',0);
  await tween(200,p=>setDropper({bulb:.7+.3*p}));
}

async function onBottle2(i){
  if(busy)return;
  if(state.phase!==4){if(state.phase>4)toast('시료는 모두 넣었어요.');return;}
  const E=state.e;
  if(E.done[i]){toast(`${NAMES[i]}는 이미 시험관에 넣었어요.`);return;}
  if(i!==E.next){toast(`먼저 반짝이는 ${NAMES[E.next]} 용기를 클릭해 보세요!`);shake('e',i);return;}
  busy=true;hideHint();
  await sampleRun('e',i,()=>fillTube(i));
  E.done[i]=1;E.next=i+1;setProgress(NAMES,E.done,E.next);
  if(E.next<4){showHint(E.next);toast(`잘했어요! 이번에는 ${NAMES[E.next]}를 넣어 볼까요?`);busy=false;return;}
  // 시료를 다 넣으면 베네딕트 용액 등장
  await wait(400);
  await fade($('#bottles2'),1,0,500);show($('#bottles2'),false);
  state.phase=5;
  setPanel('단계 ② 베네딕트 용액 넣기',['반짝이는 시약병을 클릭하면','각 시험관에 베네딕트 용액을','3방울씩 떨어뜨려요.']);
  setProgress(E2_STEPS,[1,0,0,0],1);
  await showReagent(BENEDICT);
  toast('베네딕트 용액이 준비되었어요!');
  busy=false;
}

async function benedictDrop(c,k){
  const tipX=SX+RD.x, tipY=SY+RD.y+RTIP, oil=TUBE_AFTER[c]===null;
  const drop=$('#tbd'+c);   // 라벨 뒤로 떨어지도록 시험관 안쪽 층 사용
  setAttrs(drop,{fill:rgba(BENEDICT.color),cx:tipX-TX[c],cy:tipY+4,opacity:1});
  const f0=RD.fluid;
  await tween(160,p=>setR({bulb:1-.28*p,fluid:f0-2.5*p}));
  const target=oil?TB-5-state.tbb[c]:TB-TLV;
  await tween(oil?380:240,p=>drop.setAttribute('cy',lerp(tipY+4,target,p)),easeIn);
  drop.setAttribute('opacity',0);
  const rel=tween(220,p=>setR({bulb:.72+.28*p}));
  if(oil){
    const h0=state.tbb[c];state.tbb[c]+=3.5;
    await tween(260,p=>setAttrs($('#tbb'+c),{y:TB-(h0+3.5*p),height:h0+3.5*p}));
  }else{
    const from=state.tc[c].slice(), to=mix(WELL_RGBA[c],TUBE_AFTER[c],(k+1)/3);
    await tween(300,p=>{state.tc[c]=mix(from,to,p);$('#tbl'+c).setAttribute('fill',rgba(state.tc[c]));});
  }
  await rel;
}

async function runBenedict(){
  busy=true;hideHint();
  await openStation();
  for(let c=0;c<4;c++){
    await moveRTip(TX[c],TT-22,c===0?850:420);
    for(let k=0;k<3;k++){await benedictDrop(c,k);await wait(80);}
  }
  await closeStation();
  setProgress(E2_STEPS,[1,1,0,0],2);
  await wait(500);
  await hideReagent();
  state.phase=6;
  setPanel('단계 ③ 중탕 가열',['시험관대를 클릭하면','시험관을 뜨거운 물이 담긴','비커에 넣어요.']);
  showRingAt(370,624,464,288);
  toast('이제 시험관대를 클릭해 보세요!');
  busy=false;
}

async function runHeat(){
  busy=true;hideHint();
  // 뜨거운 물이 담긴 비커 등장
  const bb=$('#bkBack'), bf=$('#bkFront');show(bb,true);show(bf,true);
  await tween(700,p=>[bb,bf].forEach(g=>{g.setAttribute('opacity',p);g.setAttribute('transform',`translate(0,${30*(1-p)})`);}),easeOut);
  $('#steam').classList.add('on');
  // 시험관을 하나씩 비커 속으로
  for(let c=0;c<4;c++){
    const tb=$('#tb'+c), x0=TX[c], x1=IN_X[c];
    await tween(420,p=>tb.setAttribute('transform',`translate(${x0},${LIFT*p})`));
    await tween(620,p=>tb.setAttribute('transform',`translate(${lerp(x0,x1,p)},${LIFT})`));
    await tween(500,p=>tb.setAttribute('transform',`translate(${x1},${lerp(LIFT,IN_DY,p)})`),easeOut);
  }
  // 시험관대는 흐려지면서 사라짐
  await tween(800,p=>['rackBack','rackFront'].forEach(id=>$('#'+id).setAttribute('opacity',1-p)));
  ['rackBack','rackFront'].forEach(id=>show($('#'+id),false));
  await tween(800,p=>{
    const d=BK_DX*p;
    [bb,bf].forEach(g=>g.setAttribute('transform',`translate(${d},0)`));
    IN_X.forEach((x,c)=>$('#tb'+c).setAttribute('transform',`translate(${x+d},${IN_DY})`));
  });
  state.phase=7;
  setPanel('단계 ③ 중탕 가열',['시험관 4개를 뜨거운 물에','10분 동안 담가 두어요.','']);
  // 비커 옆 시계: 10분이 빠르게 흐르며 색깔 변화
  await wait(300);
  const ck=$('#clock');show(ck,true);
  await tween(500,p=>{ck.setAttribute('opacity',p);ck.setAttribute('transform',`translate(880,500) scale(${.6+.4*p})`);},easeOut);
  await tween(6000,p=>{
    setClock(p);
    HEAT.forEach((st,c)=>{if(st){state.tc[c]=stopsAt(st,p);$('#tbl'+c).setAttribute('fill',rgba(state.tc[c]));}});
  },t=>t);
  $('#clockTxt').textContent='10분 경과!';
  setProgress(E2_STEPS,[1,1,1,0],3);
  state.phase=8;
  setPanel('단계 ④ 결과 기록하기',['시험관의 색깔 변화를 관찰한 뒤','오른쪽 위 보고서 버튼을 눌러','결과를 기록해 보세요.']);
  toast('10분이 지났어요! 시험관의 색깔 변화를 관찰해 보세요.');
  await wait(1500);
  $('#reportBtn').classList.add('attn');
  busy=false;
}
function setClock(p){
  const a=60*p*Math.PI/180;
  $('#minHand').setAttribute('transform',`rotate(${60*p})`);
  $('#secHand').setAttribute('transform',`rotate(${3600*p})`);
  $('#minArc').setAttribute('d',p>0?`M0 0 L0 -64 A64 64 0 0 1 ${64*Math.sin(a)} ${-64*Math.cos(a)} Z`:'');
  $('#clockTxt').textContent=`${Math.min(10,Math.floor(p*10+1e-6))}분`;
}

/* ---- 완료 창 ---- */
function openDone(kind){
  const one=kind===1;
  $('#doneTitle').textContent=one?'🎉 시료 넣기 완료!':'♨️ 중탕 가열 시작!';
  $('#doneText').innerHTML=one?'네 가지 시료를 12홈판의 각 세로줄에 모두 넣었어요.<br>이제 검출 시약을 넣어 볼까요?':
    '시험관 4개를 뜨거운 물이 담긴 비커에 넣었어요.<br>다음 단계(10분 뒤 색깔 변화 관찰)는 준비 중이에요.';
  $('#phase2Btn').style.display=one?'':'none';
  $('#againBtn').style.display=$('#closeDone').style.display=one?'none':'';
  $('#doneModal').classList.add('on');
}
$('#phase2Btn').onclick=()=>{$('#doneModal').classList.remove('on');startReagents();};

/* ---- 실험실 목록으로 (진행 중이면 확인) ---- */
$('#hubBtn').onclick=e=>{if(state&&state.phase<10&&!confirm('실험실 목록으로 돌아갈까요?\n지금까지의 진행 상황은 저장되지 않아요.'))e.preventDefault();};

/* ---- 사전(검출 방법) ---- */
$('#dictBtn').onclick=()=>$('#dictModal').classList.add('on');
$('#dictClose').onclick=()=>$('#dictModal').classList.remove('on');
$('#dictModal').onclick=e=>{if(e.target.id==='dictModal')$('#dictModal').classList.remove('on');};
addEventListener('keydown',e=>{if(e.key==='Escape'){$('#dictModal').classList.remove('on');closeReport();}});
$('#againBtn').onclick=()=>{$('#doneModal').classList.remove('on');startLab();};
$('#closeDone').onclick=()=>$('#doneModal').classList.remove('on');
</script>
