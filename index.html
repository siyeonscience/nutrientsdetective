<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동물과 에너지 과학 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{background:#ead9b5;}
body{background:radial-gradient(ellipse at 50% 30%,#fff8e8 0%,#f2e4c6 60%,#e2cfa6 100%) fixed;color:#2f2a24;
  font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;overflow-x:hidden;}
.jua{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;}
.screen{display:none;min-height:100%;}
.screen.on{display:block;}

.btn{font-family:'Jua','Malgun Gothic',sans-serif;font-size:24px;padding:14px 52px;border:none;border-radius:999px;
  background:linear-gradient(#ff9d45,#f06e28);color:#fff;cursor:pointer;letter-spacing:.04em;
  box-shadow:0 6px 0 #c4541b,0 12px 22px rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c4541b,0 6px 12px rgba(0,0,0,.18);}

/* ===== 첫 화면 ===== */
#home{position:relative;height:100vh;overflow:hidden;}
.home-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;padding:20px;transition:opacity .45s,transform .45s;}
#home.leave .home-in{opacity:0;transform:translateY(-30px);}
.home-title{font-family:'Jua','Malgun Gothic',sans-serif;font-size:clamp(40px,8vw,84px);color:#3d2b17;letter-spacing:.03em;
  line-height:1.15;text-shadow:0 5px 0 #f6c453,0 10px 22px rgba(0,0,0,.15);word-break:keep-all;}
.home-sub{font-size:clamp(14px,2.4vw,19px);color:#6b5638;margin-bottom:26px;word-break:keep-all;}
.organs{display:flex;gap:clamp(12px,3vw,28px);margin-bottom:6px;}
.organs svg{width:clamp(54px,9vw,84px);height:clamp(54px,9vw,84px);animation:bob 3s ease-in-out infinite;}
.organs svg:nth-child(2){animation-delay:.4s;}.organs svg:nth-child(3){animation-delay:.8s;}.organs svg:nth-child(4){animation-delay:1.2s;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

/* ===== 실험 목록 ===== */
#list{padding:0 16px 40px;}
#list.enter .wrap{animation:rise .5s ease-out;}
@keyframes rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:16px 0 4px;gap:12px;}
.topbar .t{font-family:'Jua','Malgun Gothic',sans-serif;font-size:22px;color:#3d2b17;}
@media (max-width:560px){.topbar .t{font-size:17px;}}
.home-link{font-family:'Jua','Malgun Gothic',sans-serif;font-size:16px;color:#6b5638;background:rgba(255,255,255,.7);border:none;
  padding:7px 16px;border-radius:999px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1);white-space:nowrap;}
.wrap{max-width:1080px;margin:0 auto;}
.wrap h2{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:clamp(26px,4vw,36px);color:#3d2b17;margin:18px 0 4px;}
.wrap .lead{color:#6b5638;margin-bottom:22px;font-size:15px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.grid{grid-template-columns:1fr;}}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:#fffdf6;border:2px solid #e2d3b0;border-radius:20px;
  overflow:hidden;cursor:pointer;font:inherit;color:inherit;padding:0;box-shadow:0 6px 16px rgba(80,60,30,.12);
  transition:transform .18s,box-shadow .18s;}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 26px rgba(80,60,30,.2);}
.card:focus-visible{outline:4px solid #ffb21e;outline-offset:3px;}
.card .thumb{aspect-ratio:16/10;width:100%;display:block;}
.card .thumb svg{width:100%;height:100%;display:block;}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card .no{font-family:'Jua','Malgun Gothic',sans-serif;font-size:14px;color:#a9977a;}
.card .ct{display:block;font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:24px;color:#3d2b17;}
.card .cd{display:block;font-size:14px;color:#6b5638;line-height:1.5;word-break:keep-all;flex:1;}
.tag{align-self:flex-start;margin-top:6px;font-family:'Jua','Malgun Gothic',sans-serif;font-size:15px;padding:4px 14px;border-radius:999px;}
.tag.go{background:#f06e28;color:#fff;}
.tag.wait{background:#ece5d6;color:#8a7a60;}
.card.wait .thumb{filter:saturate(.55);}
.card.go{border-color:#f5a043;}
.card.go:not(.ext)::after{content:'NEW';position:absolute;top:12px;right:12px;background:#e5484d;color:#fff;font:700 12px 'Noto Sans KR',sans-serif;
  padding:3px 9px;border-radius:999px;letter-spacing:.05em;}
.card.zoom{transform:scale(1.04);box-shadow:0 20px 40px rgba(80,60,30,.3);}
#fadeOut{position:fixed;inset:0;background:#f0e2c4;opacity:0;pointer-events:none;transition:opacity .45s;z-index:30;}
#fadeOut.on{opacity:1;}

/* ===== 준비 중 ===== */
.overlay{position:fixed;inset:0;background:rgba(30,26,20,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;}
.overlay.on{display:flex;}
.pop{background:#fffdf6;border-radius:22px;padding:30px 36px;text-align:center;max-width:380px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .3s ease-out;}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.pop .ic{font-size:48px;margin-bottom:6px;}
.pop h3{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400;font-size:28px;color:#3d2b17;margin-bottom:6px;}
.pop p{color:#6b5638;margin-bottom:20px;line-height:1.6;word-break:keep-all;}
.pop .btn{font-size:20px;padding:10px 36px;}
</style>
</head>
<body>

<!-- ===== 첫 화면 ===== -->
<section id="home" class="screen on">
  <div class="home-in">
    <div class="organs" aria-hidden="true">
      <svg viewBox="0 0 80 80"><path d="M40 70 C14 52 6 36 14 24 C22 12 36 16 40 26 C44 16 58 12 66 24 C74 36 66 52 40 70Z" fill="#e8636b"/><path d="M26 26 Q22 30 23 37" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/></svg>
      <svg viewBox="0 0 80 80"><path d="M40 8v24" stroke="#c98a8a" stroke-width="6" stroke-linecap="round"/><path d="M36 30 C24 22 12 36 12 54 C12 68 22 72 32 66 C36 62 36 46 36 30Z" fill="#f29aa3"/><path d="M44 30 C56 22 68 36 68 54 C68 68 58 72 48 66 C44 62 44 46 44 30Z" fill="#f29aa3"/></svg>
      <svg viewBox="0 0 80 80"><path d="M30 10 C30 24 22 26 22 42 C22 62 42 72 58 62 C70 54 66 40 54 38 C46 37 44 30 44 22 L44 10Z" fill="#f3b26a"/><path d="M30 46 Q40 56 52 50" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/></svg>
      <svg viewBox="0 0 80 80"><path d="M24 14 C10 14 8 34 14 44 C20 54 32 50 32 40 C32 34 28 32 30 26 C32 18 30 14 24 14Z" fill="#c9705c"/><path d="M56 14 C70 14 72 34 66 44 C60 54 48 50 48 40 C48 34 52 32 50 26 C48 18 50 14 56 14Z" fill="#c9705c"/><path d="M31 38 Q36 52 38 66 M49 38 Q44 52 42 66" stroke="#e6b26b" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="40" cy="70" rx="9" ry="6" fill="#e6b26b"/></svg>
    </div>
    <h1 class="home-title">동물과 에너지<br>과학 실험실</h1>
    <p class="home-sub">우리 몸은 어떻게 에너지를 얻을까요? 실험으로 직접 탐구해 봐요!</p>
    <button class="btn" id="startBtn">실험 시작하기</button>
  </div>
</section>

<!-- ===== 실험 목록 ===== -->
<section id="list" class="screen">
  <div class="topbar">
    <div class="t">🔬 동물과 에너지 과학 실험실</div>
    <button class="home-link" id="homeBtn">← 처음으로</button>
  </div>
  <div class="wrap">
    <h2>어떤 실험을 해 볼까요?</h2>
    <p class="lead">실험 카드를 눌러 시작해 보세요.</p>
    <div class="grid" id="grid"></div>
  </div>
</section>

<div class="overlay" id="soon">
  <div class="pop" role="dialog" aria-labelledby="soonTitle">
    <div class="ic">🚧</div>
    <h3 id="soonTitle">준비 중입니다</h3>
    <p id="soonText"></p>
    <button class="btn" id="soonClose">확인</button>
  </div>
</div>
<div id="fadeOut"></div>

<script>
const $=s=>document.querySelector(s);

/* 썸네일 그림 (320×200) */
const THUMBS={
  nutrient:`<rect width="320" height="200" fill="#fdf0d5"/>
    <rect x="40" y="58" width="200" height="118" rx="16" fill="#fbfdff" stroke="#b4c4d2" stroke-width="3"/>
    ${[0,1,2].map(r=>[0,1,2,3].map(c=>{const f=[['#e7b45c','#3b3f8f','#d4a35e','#f0cf4a'],['#86bde6','#c4d6e4','#a77cc4','#f0cf4a'],['#d4e6f4','#f3ead0','#e2c893','#e5432a']][r][c];
      return `<ellipse cx="${72+c*45}" cy="${86+r*32}" rx="17" ry="11" fill="#e9eff4" stroke="#aebdca" stroke-width="2"/><ellipse cx="${72+c*45}" cy="${87+r*32}" rx="13" ry="8" fill="${f}"/>`;}).join('')).join('')}
    <circle cx="240" cy="76" r="38" fill="rgba(223,241,251,.75)" stroke="#3d2b17" stroke-width="9"/>
    <rect x="264" y="106" width="16" height="50" rx="7" fill="#3d2b17" transform="rotate(-42 272 131)"/>
    <path d="M222 60 Q230 50 242 50" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  saliva:`<rect width="320" height="200" fill="#e3f1fb"/>
    <path d="M150 30 C150 30 128 58 128 74 C128 88 138 96 150 96 C162 96 172 88 172 74 C172 58 150 30 150 30Z" fill="#9fd3f2" stroke="#5aa7d6" stroke-width="3"/>
    <path d="M141 70 Q141 80 149 84" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    ${[[96,'#3b3f8f'],[204,'#e7c27a']].map(([x,f])=>`<path d="M${x-17} 90 V158 A17 17 0 0 0 ${x+17} 158 V90" fill="#fff" stroke="#8ea3b5" stroke-width="3"/>
      <path d="M${x-15} 128 V158 A15 15 0 0 0 ${x+15} 158 V128Z" fill="${f}"/><ellipse cx="${x}" cy="90" rx="19" ry="4" fill="none" stroke="#8ea3b5" stroke-width="3"/>`).join('')}
    <text x="96" y="194" text-anchor="middle" font-family="Jua, sans-serif" font-size="15" fill="#3d5a72">녹말 용액</text>
    <text x="204" y="194" text-anchor="middle" font-family="Jua, sans-serif" font-size="15" fill="#3d5a72">녹말 + 침</text>`,
  vr:`<rect width="320" height="200" fill="#efe6fa"/>
    <path d="M60 92 Q40 92 34 108" stroke="#6c4fa0" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M260 92 Q280 92 286 108" stroke="#6c4fa0" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="58" y="62" width="204" height="92" rx="34" fill="#8a64c8"/>
    <rect x="74" y="76" width="76" height="64" rx="24" fill="#2e2350"/><rect x="170" y="76" width="76" height="64" rx="24" fill="#2e2350"/>
    <path d="M150 128 Q160 116 170 128" fill="#8a64c8"/>
    <path d="M96 98 C96 112 104 118 116 114 C126 110 124 100 118 98 C112 96 110 92 110 86" stroke="#f3b26a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M192 98 C192 112 200 118 212 114 C222 110 220 100 214 98 C208 96 206 92 206 86" stroke="#f3b26a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <text x="160" y="186" text-anchor="middle" font-family="Jua, sans-serif" font-size="24" fill="#6c4fa0">VR</text>`,
  circ:`<rect width="320" height="200" fill="#fde3e3"/>
    <path d="M40 60 H110 M40 140 H110 M210 60 H280 M210 140 H280" stroke="#e05a5a" stroke-width="10" stroke-linecap="round"/>
    <path d="M40 100 H110 M210 100 H280" stroke="#5a7fe0" stroke-width="10" stroke-linecap="round"/>
    <path d="M160 176 C104 140 92 106 104 82 C116 58 146 62 160 84 C174 62 204 58 216 82 C228 106 216 140 160 176Z" fill="#e8636b"/>
    <path d="M124 86 Q118 96 120 108" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M146 40 V70 M174 40 V70" stroke="#c84a52" stroke-width="10" stroke-linecap="round"/>`,
  resp:`<rect width="320" height="200" fill="#e2f4ec"/>
    <path d="M160 22 V78" stroke="#c98a8a" stroke-width="12" stroke-linecap="round"/>
    <path d="M160 76 L136 96 M160 76 L184 96" stroke="#c98a8a" stroke-width="8" stroke-linecap="round"/>
    <path d="M148 84 C118 64 84 96 84 140 C84 172 108 182 130 170 C146 160 148 124 148 84Z" fill="#f29aa3"/>
    <path d="M172 84 C202 64 236 96 236 140 C236 172 212 182 190 170 C174 160 172 124 172 84Z" fill="#f29aa3"/>
    <path d="M104 120 Q100 136 104 150" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
    <circle cx="262" cy="56" r="16" fill="#fff" opacity=".8"/><text x="262" y="62" text-anchor="middle" font-family="Jua, sans-serif" font-size="15" fill="#3a8a6a">O₂</text>
    <circle cx="58" cy="60" r="16" fill="#fff" opacity=".8"/><text x="58" y="66" text-anchor="middle" font-family="Jua, sans-serif" font-size="14" fill="#8a6a3a">CO₂</text>`,
  excr:`<rect width="320" height="200" fill="#fff1dc"/>
    <path d="M112 34 C78 34 72 82 86 104 C100 124 128 114 128 92 C128 80 120 76 124 64 C128 46 124 34 112 34Z" fill="#c9705c"/>
    <path d="M208 34 C242 34 248 82 234 104 C220 124 192 114 192 92 C192 80 200 76 196 64 C192 46 196 34 208 34Z" fill="#c9705c"/>
    <path d="M128 90 Q148 120 152 150 M192 90 Q172 120 168 150" stroke="#e6b26b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="160" cy="162" rx="26" ry="18" fill="#e6b26b"/>
    <path d="M96 56 Q90 70 94 84" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>`,
};

const LABS=[
  {id:'nutrient',title:'영양소 탐정',desc:'검출 시약으로 음식 속에 숨어 있는 영양소를 찾아요.',href:'nutrient-detective.html'},
  {id:'saliva',title:'침의 소화 작용',desc:'침이 녹말을 어떻게 바꾸는지 알아봐요.',href:'saliva-digestion.html'},
  {id:'vr',title:'소화 과정 VR',desc:'음식물이 소화되는 길을 따라가 봐요.',href:'https://filest.edunet.net/360vr/webvr/m220001034/m220001034.html',ext:true},
  {id:'circ',title:'순환계',desc:'심장과 혈관이 하는 일을 탐구해요.'},
  {id:'resp',title:'호흡계',desc:'숨을 쉴 때 폐에서 일어나는 일을 알아봐요.'},
  {id:'excr',title:'배설계',desc:'노폐물이 몸 밖으로 나가는 과정을 살펴봐요.'},
];

$('#grid').innerHTML=LABS.map((l,i)=>`<button class="card ${l.href?'go':'wait'}${l.ext?' ext':''}" data-i="${i}" aria-label="${l.title}${l.href?'':' (준비 중)'}">
  <span class="thumb"><svg viewBox="0 0 320 200" aria-hidden="true">${THUMBS[l.id]}</svg></span>
  <span class="body"><span class="no">실험 ${String(i+1).padStart(2,'0')}</span><span class="ct">${l.title}</span><span class="cd">${l.desc}</span>
  <span class="tag ${l.href?'go':'wait'}">${l.href?(l.ext?'VR 열기 ▶':'시작하기 ▶'):'준비 중'}</span></span></button>`).join('');

document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
  const l=LABS[+c.dataset.i];
  if(!l.href){
    $('#soonText').innerHTML=`<b>${l.title}</b> 실험은 지금 열심히 준비하고 있어요.<br>조금만 기다려 주세요!`;
    $('#soon').classList.add('on');$('#soonClose').focus();return;
  }
  c.classList.add('zoom');$('#fadeOut').classList.add('on');
  setTimeout(()=>location.href=l.href,450);
}));
const closeSoon=()=>$('#soon').classList.remove('on');
$('#soonClose').onclick=closeSoon;
$('#soon').onclick=e=>{if(e.target.id==='soon')closeSoon();};
addEventListener('keydown',e=>{if(e.key==='Escape')closeSoon();});

function showList(anim){
  $('#home').classList.remove('on','leave');$('#list').classList.add('on');
  $('#list').classList.toggle('enter',!!anim);
  if(location.hash!=='#list')history.replaceState(null,'','#list');
}
function showHome(){
  $('#list').classList.remove('on');$('#home').classList.add('on');
  history.replaceState(null,'',location.pathname+location.search);
}
$('#startBtn').onclick=()=>{$('#home').classList.add('leave');setTimeout(()=>showList(true),450);};
$('#homeBtn').onclick=showHome;
// 다른 실험에서 '실험실 목록'으로 돌아오면 바로 목록을 보여 줌
if(location.hash==='#list')showList(false);
// 뒤로 가기로 돌아왔을 때 화면이 덮여 있지 않도록
addEventListener('pageshow',()=>{$('#fadeOut').classList.remove('on');document.querySelectorAll('.card.zoom').forEach(c=>c.classList.remove('zoom'));});
</script>
</body>
</html>
